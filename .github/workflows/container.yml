name: Publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      subwave_ref:
        description: SUB/WAVE git branch, tag, or commit to build
        required: false
        type: string
      image_tag:
        description: Extra image tag to publish, for example dev
        required: false
        default: dev
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ inputs.image_tag || 'latest' }}
          build-args: |
            SUBWAVE_REPO=${{ vars.SUBWAVE_REPO || 'https://github.com/perminder-klair/subwave.git' }}
            SUBWAVE_REF=${{ inputs.subwave_ref || vars.SUBWAVE_REF || '90db93086945eacd07d9a2b5fe607c41a5ec2fe6' }}
            APPLY_PLAYER_PREVIEW_SUPPORT_PATCH=${{ vars.APPLY_PLAYER_PREVIEW_SUPPORT_PATCH || '1' }}
            APPLY_LYRICS_CLIENT_SUPPORT_PATCH=${{ vars.APPLY_LYRICS_CLIENT_SUPPORT_PATCH || '1' }}
            APPLY_GATEFOLD_SKIN_REGISTRY_PATCH=${{ vars.APPLY_GATEFOLD_SKIN_REGISTRY_PATCH || '1' }}
            APPLY_GATEFOLD_DEFAULT_PATCH=${{ vars.APPLY_GATEFOLD_DEFAULT_PATCH || '1' }}
            APPLY_PLAYER_ONLY_PATCH=${{ vars.APPLY_PLAYER_ONLY_PATCH || '1' }}
            APPLY_SIGNAL_ONLY_PATCH=${{ vars.APPLY_SIGNAL_ONLY_PATCH || '1' }}
            APPLY_STANDALONE_STATION_SETUP_PATCH=${{ vars.APPLY_STANDALONE_STATION_SETUP_PATCH || '1' }}
            APPLY_STANDALONE_STATION_CONTROLS_PATCH=${{ vars.APPLY_STANDALONE_STATION_CONTROLS_PATCH || '1' }}
            APPLY_SIGNAL_APP_BRANDING_PATCH=${{ vars.APPLY_SIGNAL_APP_BRANDING_PATCH || '1' }}
            SITE_URL=${{ vars.PLAYER_SITE_URL || 'https://signal.gurthyy.xyz' }}
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_STREAM_URL=
            NEXT_PUBLIC_SIGNAL_THEME_IDS=${{ vars.SIGNAL_THEME_IDS || '' }}
            NEXT_PUBLIC_SUBWAVE_STATION_SETUP=${{ vars.NEXT_PUBLIC_SUBWAVE_STATION_SETUP || 'required' }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID || '' }}
            SUBWAVE_BUILD_VERSION=${{ vars.SUBWAVE_BUILD_VERSION || 'signal-subwave-player' }}
