services:
  subwave-prism-player:
    image: ghcr.io/kylejschultz/subwave-prism-player:${SUBWAVE_PRISM_PLAYER_VERSION:-latest}
    build:
      context: .
      args:
        SUBWAVE_REPO: ${SUBWAVE_REPO:-https://github.com/perminder-klair/subwave.git}
        SUBWAVE_REF: ${SUBWAVE_REF:-90db93086945eacd07d9a2b5fe607c41a5ec2fe6}
        SUBWAVE_SKINS_REPO: ${SUBWAVE_SKINS_REPO:-https://github.com/kylejschultz/subwave-skins.git}
        SUBWAVE_SKINS_REF: ${SUBWAVE_SKINS_REF:-main}
        APPLY_SUBWAVE_SKINS_PATCHES: ${APPLY_SUBWAVE_SKINS_PATCHES:-1}
        APPLY_PRISM_DEFAULT_PATCH: ${APPLY_PRISM_DEFAULT_PATCH:-1}
        APPLY_PLAYER_ONLY_PATCH: ${APPLY_PLAYER_ONLY_PATCH:-1}
        APPLY_STANDALONE_STATION_SETUP_PATCH: ${APPLY_STANDALONE_STATION_SETUP_PATCH:-1}
        APPLY_STANDALONE_STATION_CONTROLS_PATCH: ${APPLY_STANDALONE_STATION_CONTROLS_PATCH:-1}
        APPLY_PRISM_LAYOUT_GUARD_PATCH: ${APPLY_PRISM_LAYOUT_GUARD_PATCH:-1}
        APPLY_PRISM_APP_BRANDING_PATCH: ${APPLY_PRISM_APP_BRANDING_PATCH:-1}
        SITE_URL: ${PLAYER_SITE_URL:-https://prism.gurthyy.xyz}
        NEXT_PUBLIC_API_URL: ${SUBWAVE_PUBLIC_API_URL:-}
        NEXT_PUBLIC_STREAM_URL: ${SUBWAVE_PUBLIC_STREAM_URL:-}
        NEXT_PUBLIC_PRISM_THEME_IDS: ${PRISM_THEME_IDS:-}
        NEXT_PUBLIC_SUBWAVE_STATION_SETUP: ${NEXT_PUBLIC_SUBWAVE_STATION_SETUP:-required}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        SUBWAVE_BUILD_VERSION: ${SUBWAVE_BUILD_VERSION:-prism-player}
    container_name: subwave-prism-player
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "7700"
      HOSTNAME: 0.0.0.0
      SUBWAVE_HOMEPAGE: player
      SITE_URL: ${PLAYER_SITE_URL:-https://prism.gurthyy.xyz}
      GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      CONTROLLER_INTERNAL_URL: ${SUBWAVE_CONTROLLER_INTERNAL_URL:-https://radio.gurthyy.xyz/api}
    ports:
      - "${PLAYER_PORT:-7703}:7700"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7700/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
